[project]
name = "heavi-api"
version = "0.1.0"
description = "Heavi spatial computation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.17.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.52.0",
    "httpx>=0.27.0",
    "reportlab>=4.2.0",
    "python-multipart>=0.0.9",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

# Bundle non-Python data files (the sample portfolio CSV, the fitted
# wildfire model JSON) into the installed package so they survive
# `pip install .` builders like Nixpacks/Railway. Without this, only .py
# files get copied into site-packages and the runtime cannot find them.
[tool.setuptools.package-data]
app = ["sample_portfolio.csv", "wildfire_vulnerability_model.json", "flood_validation.json", "wildfire_model_params.json"]
