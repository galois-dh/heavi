[project]
name = "heavi-data-catalog"
version = "0.1.0"
description = "Data loaders for populating Heavi PostGIS catalog"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0.0",
    "sqlalchemy>=2.0.0",
    "geoalchemy2>=0.17.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "duckdb>=1.1.0",
    "pyarrow>=18.0.0",
    "shapely>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyogrio>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
